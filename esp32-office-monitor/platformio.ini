; ================================================================
;  PlatformIO — ESP32 IoT Office Environment Monitor
;  Doc ref: IoT-Based Office Environment Monitoring System
;
;  Sensors : DHT22, MQ-35 Gas, Smoke sensor, Fire sensor, LDR
;  Output  : 16x2 LCD (I2C), Active Buzzer, Relay module
;  Network : MQTT via WiFi → broker.hivemq.com
; ================================================================

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed  = 115200

lib_deps =
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.4
    knolleary/PubSubClient @ ^2.8.0
   bblanchon/ArduinoJson @ ^6.21.3

build_flags =
    -DCORE_DEBUG_LEVEL=0
